<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- WordCraft app icon, Arthavan Projects house style: a light glyph on a dark tile in the app's own tint.
       Original artwork drawn in code, MIT OR Apache-2.0 like the repository. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d4d"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>
  <g fill="none" stroke="#98a9e1" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M124 150 H388 M124 214 H388 M124 278 H300 M124 342 H244" />
    <path d="M320 262 V 394 M296 262 H344 M296 394 H344" stroke="#c2cef4" stroke-width="20"/>
  </g>
  </g>
</svg>
